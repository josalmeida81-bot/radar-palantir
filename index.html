<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Radar Palantir</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;padding:14px 14px 80px}
h1{font-size:20px;margin:0}
.sub{color:#94a3b8;font-size:13px;margin:2px 0 12px}
.bar{display:flex;gap:8px;margin-bottom:10px}
button{flex:1;padding:13px;font-size:15px;border:0;border-radius:10px;background:#6366f1;color:#fff;font-weight:600}
button.sec{background:#1e293b;color:#cbd5e1}
input{width:100%;padding:13px;font-size:15px;border:0;border-radius:10px;background:#1e293b;color:#e2e8f0;margin-bottom:8px}
.card{background:#1e293b;border-radius:12px;padding:12px;margin-bottom:8px}
.top{display:flex;align-items:center;gap:12px}
.pos{font-size:13px;color:#64748b;width:22px}
.tk{font-weight:700;font-size:16px}
.nm{font-size:12px;color:#94a3b8}
.pt{margin-left:auto;font-size:26px;font-weight:800}
.barra{height:6px;border-radius:3px;background:#334155;margin-top:8px;overflow:hidden}
.barra>div{height:100%;background:linear-gradient(90deg,#6366f1,#4ade80)}
.det{display:none;margin-top:10px}
.card.aberto .det{display:block}
.l{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #334155;font-size:13px}
.ok{color:#4ade80}.no{color:#f87171}
#estado{color:#94a3b8;font-size:12px;margin:6px 0}
.aviso{color:#64748b;font-size:11px;margin-top:16px;line-height:1.4}
</style>
</head>
<body>
<h1>Radar Palantir</h1>
<div class="sub">Que empresas se parecem mais com a Palantir em crescimento?</div>

<div id="setup" style="display:none">
  <input id="chave" placeholder="Cole a chave gratuita da Financial Modeling Prep">
  <button onclick="guardarChave()">Guardar chave</button>
</div>

<div class="bar">
  <button onclick="atualizar(true)">Atualizar agora</button>
  <button class="sec" onclick="mudarChave()">Chave</button>
</div>
<div id="estado"></div>
<div id="lista"></div>

<div class="aviso">Ferramenta de apoio à pesquisa. Mede semelhança de perfil com a Palantir; não prevê subidas nem é aconselhamento financeiro. Confirme sempre os números noutra fonte antes de decidir.</div>

<script src="app.js"></script>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}
</script>
</body>
</html>
